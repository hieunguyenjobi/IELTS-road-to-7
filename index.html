<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Coach</title>
<meta name="description" content="Huấn luyện viên nhắc kế hoạch học IELTS Academic 7.0 mỗi ngày">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IELTS Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#edf0f4;--card:#fff;--tx:#14213d;--mu:#5d687d;--ln:#d9dfe8;--ink:#14213d;--hi:#f2c94c;--ok:#1f9d63;--warn:#b86e0d;--acc:#2a9d6f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e131c;--card:#171e2b;--tx:#e8edf6;--mu:#9aa6ba;--ln:#273044;--ink:#1f2c4a;--warn:#e3a33f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e131c;--card:#171e2b;--tx:#e8edf6;--mu:#9aa6ba;--ln:#273044;--ink:#1f2c4a;--warn:#e3a33f;color-scheme:dark}
body[data-s="2"]{--acc:#4a78e8}body[data-s="3"]{--acc:#e0a02e}body[data-s="4"]{--acc:#ee6a52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:680px;margin:0 auto;padding:10px 14px 100px}
h1{font-size:27px;line-height:1.15;margin:2px 0 0;font-weight:800;letter-spacing:-.02em}
h2{font-size:16px;margin:0 0 8px;font-weight:700}
p{margin:6px 0}.mu{color:var(--mu)}.sm{font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;padding:2px 0 10px}
.logo{font-weight:800;font-size:17px;letter-spacing:-.01em}.logo b{color:var(--acc)}
.ib{border:1px solid var(--ln);background:var(--card);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--tx)}
.hero{background:var(--ink);color:#fff;border-radius:14px;padding:18px 18px 16px}
.hr{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dt{font-size:13px;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 8px}
.chip{background:rgba(255,255,255,.14);border-radius:99px;padding:2px 10px;font-size:12.5px}
.chip.a{background:var(--acc);color:#10151f;font-weight:700}
.foc{margin:6px 0 14px;font-size:15px;opacity:.95}
.sg{display:flex;gap:3px;height:16px}.sg i{border-radius:4px;background:rgba(255,255,255,.18)}
.sg i.on{background:var(--acc)}.sg i.nx{background:var(--hi)}
.sgl{display:flex;justify-content:space-between;font-size:12px;opacity:.75;margin-top:6px}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin:12px 0}
.panel.l{border-left:5px solid var(--acc)}.panel.w{border-left-color:var(--warn)}
.nt{font-size:17px;font-weight:700;margin:2px 0 10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.row.s{justify-content:flex-start;flex-wrap:wrap}
.btn{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#10151f;font-weight:700}
.btn:focus-visible,.ck:focus-visible,.pl:focus-visible,nav button:focus-visible,.mc:focus-visible,.dr:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.tk{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.tk:first-of-type{border-top:0}
.ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--mu);background:none;color:#10151f;font-size:15px;cursor:pointer;padding:0;line-height:1}
.tk.dn .ck{background:var(--acc);border-color:var(--acc)}.tk.dn .tt{color:var(--mu);text-decoration:line-through}
.tt{flex:1}.mn{font-size:12.5px;color:var(--mu)}
.pl{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--acc);background:none;color:var(--acc);cursor:pointer;font-size:11px;padding:0}
.blk{font-size:13px;font-weight:700;color:var(--acc);margin:10px 0 2px}
.dr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer}
.dr.td{border-color:var(--acc);box-shadow:inset 4px 0 0 var(--acc)}
.dd{width:38px;text-align:center;line-height:1.2}.dd span{display:block;font-size:12px;color:var(--mu)}
.dm{flex:1;min-width:0}.ds{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{flex:none}.rt{stroke:var(--ln)}.rp{stroke:var(--acc);transition:stroke-dashoffset .4s}.rl{font-size:13px;font-weight:700;fill:var(--tx)}
.hero .rt{stroke:rgba(255,255,255,.2)}.hero .rl{fill:#fff}.hero .rp{stroke:var(--hi)}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center}.stats b{display:block;font-size:22px}
.stg{margin:16px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.mg{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
.mc{aspect-ratio:1;border-radius:5px;border:1px solid var(--ln);background:var(--card);font:inherit;font-size:10px;color:var(--mu);cursor:pointer;padding:0}
.mc.c1{background:color-mix(in srgb,var(--sa) 35%,var(--card))}.mc.c2{background:var(--sa);color:#10151f;border-color:transparent}
.mc.bf{border-style:dashed;border-color:var(--mu)}.mc.gt{box-shadow:inset 0 -3px 0 var(--hi)}.mc.cur{outline:2px solid var(--tx);outline-offset:1px}
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}.pill{flex:none;font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 12px;cursor:pointer}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sc,#sd{width:68px;font:inherit;padding:7px;border-radius:8px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}#sd{width:auto}
.tr{display:flex;align-items:flex-end;gap:8px;height:110px;margin:8px 0}.tr div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mu)}
.tr i{display:block;width:70%;background:var(--acc);border-radius:4px 4px 0 0;min-height:3px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav .in{display:flex;max-width:680px;margin:0 auto}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11.5px;padding:3px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
nav button i{font-style:normal;font-size:20px;line-height:1.3}nav button.on{color:var(--tx);font-weight:800}
nav button.on i{filter:none}nav button.on:after{content:"";width:18px;height:3px;border-radius:3px;background:var(--acc);margin-top:2px}
.ov{position:fixed;inset:0;background:rgba(8,12,20,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:680px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:up .22s ease-out}
.fx{background:var(--ink);align-items:center;color:#fff}.fxb{text-align:center;padding:20px;animation:up .22s ease-out}
.fxw{position:relative;display:grid;place-items:center;margin:18px 0}.fxw .rt{stroke:rgba(255,255,255,.2)}.fxw .rp{stroke:var(--hi)}
.fxt{position:absolute;font-size:46px;font-weight:800}.fxl{font-size:18px;max-width:420px;margin:0 auto}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

 if(/^Nghỉ/.test(t))return{rest:true,text:t,items:[]};
 const parts=t.split(/\)\s*\+\s*/);
 return{rest:false,items:parts.map((p,i)=>{if(i<parts.length-1)p+=")";const m=p.match(/^(.*?)\s*\((?:tối đa )?(\d+)['′’]\)(?::\s*(.*))?$/);if(!m)return{t:p,m:0};const k=/^Khối 2/.test(m[1]);return{t:k?m[3]:m[1]+(m[3]?": "+m[3]:""),m:+m[2],k}})};

 if(p.w>=D.length)return`<div class="panel"><h1>Bạn đã đi hết 104 tuần</h1><p>Nếu chưa thi, hãy đặt lịch theo quy tắc vàng và giữ nhịp ôn nhẹ mỗi ngày.</p></div>`;
 const W=D[p.w],di=dayInfo(p.w,p.dow,view),st=streak(T),wi=weekInfo(p.w),t=di.t,nx=t.items.findIndex((_,j)=>!di.dn.includes(j));
 let debt=0,miss=[];if(isT)for(let i=0;i<p.dow;i++){const x=wi.days[i];if(!x.t.rest&&x.pl>x.dm){debt+=x.pl-x.dm;if(x.dm<x.pl/2)miss.push(i)}}
 const hr=new Date().getHours(),gr=hr<11?"Chào buổi sáng":hr<14?"Chào buổi trưa":hr<18?"Chào buổi chiều":"Chào buổi tối",pct=di.n?di.dn.length/di.n:0;
 let h=`<section class="hero"><div class="hr"><div><div class="dt">${DN[p.dow]}, ${view.toLocaleDateString("vi-VN")}${isT?"":" (không phải hôm nay)"}</div><h1>${isT?gr:DN[p.dow]}</h1></div>${t.rest?'<div style="font-size:40px">🌙</div>':ring(pct,72,8,"",Math.round(pct*100)+"%")}</div><div class="chips"><span class="chip a">${esc(W[2])}</span><span class="chip">Tuần ${W[0]} trên 104</span>${W[7]!=="Tuần học"?`<span class="chip">${esc(W[7])}</span>`:""}${st?`<span class="chip">🔥 ${st} ngày liên tiếp</span>`:""}</div><p class="foc">${esc(W[3])}</p>`;
 if(!t.rest)h+=`<div class="sg" role="img" aria-label="Các khối học hôm nay">${t.items.map((it,j)=>`<i class="${di.dn.includes(j)?"on":j===nx?"nx":""}" style="flex:${it.m||10}"></i>`).join("")}</div><div class="sgl"><span>${di.dm} phút đã học</span><span>${di.pl} phút theo lịch</span></div>`;
 h+=`</section>`;
 if(!t.rest){h+=nx>=0?`<div class="panel l"><div class="mu sm">Việc tiếp theo</div><div class="nt">${esc(t.items[nx].t)}</div><div class="row"><span class="mu">${t.items[nx].m?t.items[nx].m+" phút":"Không ghi thời lượng"}</span>${t.items[nx].m?`<button class="btn pri" data-a="play" data-j="${nx}">▶ Bấm giờ</button>`:`<button class="btn pri" data-a="tg" data-j="${nx}">Đánh dấu xong</button>`}</div></div>`:`<div class="panel l"><b>🎉 Hoàn thành toàn bộ hôm nay.</b><div class="mu">Chuỗi học hiện tại: ${st} ngày.</div></div>`}
 if(isT&&debt>=30&&!t.rest)h+=`<div class="panel w"><b>Còn nợ ${debt} phút từ đầu tuần</b><p class="mu sm">Chạm vào ngày để học bù phần còn thiếu.</p><div class="row s">${miss.map(i=>`<button class="pill" data-a="go" data-d="${iso(add(wi.mon,i))}">${SH[i]}</button>`).join("")||'<span class="mu sm">Các ngày nợ đều đã học một nửa trở lên.</span>'}</div></div>`;
 h+=`<div class="panel"><h2>${t.rest?"Hôm nay":"Việc cần làm"}</h2>`;
 if(t.rest)h+=`<p>${esc(t.text)}</p>`;
 const hk=t.items.some(x=>x.k);
 t.items.forEach((it,j)=>{const d=di.dn.includes(j);if(hk&&(j===0||(it.k&&!t.items[j-1].k)))h+=`<div class="blk">${it.k?"Khối 2, 60 phút":"Khối 1"}</div>`;
  h+=`<div class="tk${d?" dn":""}"><button class="ck" data-a="tg" data-j="${j}" aria-label="Đánh dấu hoàn thành">${d?"✓":""}</button><div class="tt">${esc(it.t)}</div>${it.m?`<span class="mn">${it.m} phút</span>`:""}${it.m&&!d?`<button class="pl" data-a="play" data-j="${j}" aria-label="Bấm giờ">▶</button>`:""}</div>`});
 h+=`</div><div class="panel l"><h2>Lời nhắc của coach</h2>${coach(W,di,isT,st,debt).filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join("")}</div>`;
 const g=GT[W[0]]||GT[W[0]+1];if(g)h+=gateCard(g,!!GT[W[0]]);
 if(W[0]>=95)h+=`<div class="panel w"><h2>Quy tắc vàng</h2>${esc(RULE)}</div>`;
 if(MT[W[0]])h+=`<div class="panel"><b>Tuần này có điểm thi thử.</b> <button class="btn" data-a="mk" data-w="${W[0]}">Nhập điểm</button></div>`;
 if(W[6].length)h+=`<div class="panel"><h2>Nhắc trong tuần</h2><ul style="margin:0;padding-left:18px">${W[6].map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>`;
 const np=pos(add(view,1));if(np.w<D.length){const nd=tasks(D[np.w][4][np.dow]);h+=`<div class="panel"><h2>Ngày mai</h2><span class="mu">${nd.rest?esc(nd.text):nd.items.map(i=>esc(i.t)).join("; ")}</span></div>`}
 return h+`<div class="row"><button class="btn" data-a="prev">‹ Hôm trước</button><button class="btn" data-a="today">Hôm nay</button><button class="btn" data-a="next">Hôm sau ›</button></div>`}
const curW=()=>Math.max(0,Math.min(103,pos(view||t0()).w));
function weekTab(){const w=wk==null?curW():wk,W=D[w],wi=weekInfo(w),T=utc(t0());
 let h=`<div class="row"><button class="btn" data-a="pw" ${w<1?"disabled":""}>‹ Tuần trước</button><b>Tuần ${W[0]}</b><button class="btn" data-a="nw" ${w>102?"disabled":""}>Tuần sau ›</button></div>`;
 h+=`<section class="hero" style="margin-top:12px"><div class="chips" style="margin-top:0"><span class="chip a">${esc(W[2])}</span><span class="chip">Tháng ${W[1]}</span>${W[7]!=="Tuần học"?`<span class="chip">${esc(W[7])}</span>`:""}</div><p class="foc" style="margin-bottom:10px">${esc(W[3])}</p><div class="bar" style="background:rgba(255,255,255,.2)"><i style="width:${wi.pl?Math.round(wi.dm/wi.pl*100):0}%;background:var(--hi)"></i></div><div class="sgl"><span>${wi.dm} phút đã học</span><span>${wi.pl} phút theo lịch</span></div></section>`;
 h+=`<div class="panel"><b>Đầu ra của tuần</b><p>${esc(W[5])}</p>${W[9]?`<p class="mu sm">Từ mới mục tiêu: ${W[9]} từ</p>`:""}</div>`;
 wi.days.forEach((x,i)=>{const d=add(wi.mon,i),td=utc(d)===T,p=x.n?x.dn.length/x.n:0;
  h+=`<button class="dr${td?" td":""}" data-a="go" data-d="${iso(d)}"><div class="dd"><b>${SH[i]}</b><span>${d.getDate()}/${d.getMonth()+1}</span></div><div class="dm"><div class="ds">${x.t.rest?esc(x.t.text):esc(x.t.items[0].t)}</div><div class="mu sm">${x.t.rest?"Ngày nghỉ":x.n+" phần, "+x.pl+" phút"}</div></div>${x.t.rest?"🌙":ring(p,34,4,"",p===1?"✓":"")}</button>`});
 return h}
function mapTab(){const T=t0(),cw=pos(T).w,tt=totals();
 let h=`<div class="stats"><div><b>${cw>=0&&cw<104?cw+1:"–"}</b><span class="mu sm">Tuần hiện tại</span></div><div><b>${tt.dd}</b><span class="mu sm">Ngày đã học</span></div><div><b>${Math.round(tt.m/6)/10}</b><span class="mu sm">Giờ đã học</span></div></div>`;
 [0,1,2,3].forEach(s=>{let c="",dn=0;for(let w=s*26;w<s*26+26;w++){const wi=weekInfo(w),r=wi.pl?wi.dm/wi.pl:0;if(r>=.8)dn++;const W=D[w];
  c+=`<button class="mc ${r>=.8?"c2":r>0?"c1":""}${W[7]!=="Tuần học"?" bf":""}${GT[W[0]]?" gt":""}${w===cw?" cur":""}" data-a="gw" data-w="${w}" aria-label="Tuần ${W[0]}" title="${esc(W[3])}">${W[0]}</button>`}
  h+=`<div class="stg"><b>${D[s*26][2]}</b><span class="mu sm">${dn} trên 26 tuần</span></div><div class="mg" style="--sa:${SC[s]}">${c}</div>`});
 return h+`<p class="mu sm" style="margin-top:14px">Ô đặc là tuần đã học từ 80% lịch. Viền nét đứt là tuần đệm. Gạch vàng dưới ô là tuần có cổng đánh giá.</p>`}
function scoreTab(){if(sel==null)sel=[...MS].reverse().find(x=>x<=curW()+1)||26;
 const m=mock[sel]||{},tg=MT[sel],o=ovr(m),g=GT[sel]||GT[97],last=[...MS].reverse().find(w=>ovr(mock[w])!=null);
 let h=`<div class="panel l"><h2>Điểm gần nhất</h2>${last?`<div style="font-size:34px;font-weight:800">${ovr(mock[last])}</div><span class="mu">Tuần ${last}, mục tiêu cuối 7.0</span>${last>=95?`<p>${ovr(mock[last])>=6.5?"Đạt ngưỡng tối thiểu 6.5 để cân nhắc thi. Cần 2–3 mock gần nhất ổn định.":"Dưới 6.5: chưa nên đăng ký thi thật."}</p>`:""}`:'<p class="mu">Chưa có điểm. Làm bài thi thử ở các tuần mốc và nhập vào đây.</p>'}</div>`;
 h+=`<div class="pills">${MS.map(w=>`<button class="pill${w===sel?" on":""}" data-a="ms" data-w="${w}">Tuần ${w}</button>`).join("")}</div><div class="panel"><h2>Thi thử tuần ${sel} (mục tiêu ${tg})</h2><div class="row s">${KS.map((k,i)=>`<label class="mu sm">${NM[i]}<br><input class="sc" id="m-${k}" type="number" step="0.5" min="0" max="9" value="${m[k]??""}"></label>`).join("")}</div><div style="margin-top:10px"><button class="btn pri" data-a="svm">Lưu điểm</button></div>${err?`<p style="color:var(--warn)">${esc(err)}</p>`:""}`;
 if(o!=null){const a=KS.map(k=>m[k]);h+=`<p><b>Overall ${o}</b>, ${o>=tg?"+":""}${o-tg} so với mục tiêu. Kỹ năng yếu nhất: ${NM[a.indexOf(Math.min(...a))]}.</p><p>${esc(o>=tg?g.ok:o>=tg-.5?g.half:g.one)}</p><p class="mu sm">Band tự đánh giá không thay thế đánh giá chính thức Writing và Speaking.</p>`}
 h+=`</div><div class="panel"><h2>Xu hướng Overall</h2><div class="tr">${MS.map(w=>{const v=ovr(mock[w]);return`<div><i style="height:${v?v/9*100:3}%"></i>${v??"–"}<br>T${w}</div>`}).join("")}</div></div>`;
 const gg=GT[sel]||(sel>=95?GT[97]:null);return h+(gg?gateCard(gg,true):"")}
function sheetHtml(){const th=S.get("ielts_theme")||"auto";return`<div class="ov" data-a="close"><div class="sheet"><h2>Cài đặt</h2><p class="mu sm">Ngày bắt đầu Tuần 1</p><div class="row s"><input type="date" id="sd" value="${start}"><button class="btn pri" data-a="sd">Lưu</button></div><p class="mu sm" style="margin-top:16px">Giao diện</p><div class="row s">${[["auto","Tự động"],["light","Sáng"],["dark","Tối"]].map(([v,l])=>`<button class="pill${th===v?" on":""}" data-a="th" data-v="${v}">${l}</button>`).join("")}</div><p class="mu sm" style="margin-top:16px">Dữ liệu trên thiết bị này</p><div class="row s"><button class="btn" data-a="bk">Sao lưu dữ liệu</button><button class="btn" data-a="rs">Khôi phục</button></div><input type="file" id="rsf" accept="application/json" hidden><div style="margin-top:18px"><button class="btn" data-a="close">Đóng</button></div></div></div>`}
const fxHtml=()=>`<div class="ov fx"><div class="fxb"><div class="fxl">${esc(fx.l)}</div><div class="fxw">${ring(1,250,14,"fxr")}<div class="fxt" id="fxt">--:--</div></div><div class="row s" style="justify-content:center"><button class="btn" data-a="fxp">${fx.rem!=null?"Tiếp tục":"Tạm dừng"}</button><button class="btn" data-a="fx5">Thêm 5 phút</button></div><div class="row s" style="justify-content:center;margin-top:10px"><button class="btn pri" data-a="fxd">✓ Xong</button><button class="btn" data-a="fxx">Đóng</button></div></div></div>`;
function render(){
 if(!start){app.innerHTML=setup();nav.innerHTML="";ovl.innerHTML="";return}
 const q=pos(view||t0());document.body.dataset.s=q.w>=0&&q.w<104?D[q.w][2][2]:"1";
 const y=scrollY;app.innerHTML=head()+({today:todayTab,week:weekTab,map:mapTab,score:scoreTab}[tab])();
 nav.innerHTML='<div class="in">'+[["today","🏠","Hôm nay"],["week","📅","Tuần"],["map","🗺️","Lộ trình"],["score","📈","Điểm"]].map(([k,i,l])=>`<button class="${tab===k?"on":""}" data-a="tab" data-t="${k}"><i>${i}</i>${l}</button>`).join("")+"</div>";
 ovl.innerHTML=sheet?sheetHtml():fx?fxHtml():"";scrollTo(0,y)}
const toggle=(k,j,on)=>{const s=new Set(done[k]||[]);on?s.add(j):s.has(j)?s.delete(j):s.add(j);done[k]=[...s];saveD()};
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime);o.start();o.stop(a.currentTime+.4)}catch(e){}}
function fxDraw(){if(!fx)return;const r=fx.rem!=null?fx.rem:Math.max(0,fx.end-Date.now()),t=$("#fxt"),c=$("#fxr");if(!t)return;
 t.textContent=r?pad(Math.floor(r/6e4))+":"+pad(Math.floor(r%6e4/1e3)):"Hết giờ";
 if(c)c.style.strokeDashoffset=String(+c.getAttribute("stroke-dasharray")*(1-r/fx.tot));
 if(!r&&!fx.fin){fx.fin=true;try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}beep()}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,s=b.dataset;
 if(a==="close"&&e.target!==b)return;
 if(a==="tab"){tab=s.t;wk=null;scrollTo(0,0)}
 else if(a==="tg")toggle(iso(view),+s.j);
 else if(a==="play"){const p=pos(view),it=tasks(D[p.w][4][p.dow]).items[+s.j];fx={k:iso(view),j:+s.j,l:it.t,tot:it.m*6e4,end:Date.now()+it.m*6e4,rem:null,fin:false}}
 else if(a==="fxp"){if(fx.rem!=null){fx.end=Date.now()+fx.rem;fx.rem=null}else fx.rem=Math.max(0,fx.end-Date.now())}
 else if(a==="fx5"){fx.tot+=3e5;fx.rem!=null?fx.rem+=3e5:fx.end+=3e5;fx.fin=false}
 else if(a==="fxd"){toggle(fx.k,fx.j,true);fx=null}else if(a==="fxx")fx=null;
 else if(a==="go"){view=parse(s.d);tab="today";scrollTo(0,0)}
 else if(a==="gw"){wk=+s.w;tab="week";scrollTo(0,0)}
 else if(a==="pw")wk=Math.max(0,(wk==null?curW():wk)-1);else if(a==="nw")wk=Math.min(103,(wk==null?curW():wk)+1);
 else if(a==="prev"){if(pos(view).n>0)view=add(view,-1)}else if(a==="next"){if(pos(view).n<727)view=add(view,1)}else if(a==="today")view=null;
 else if(a==="mk"){sel=+s.w;tab="score";scrollTo(0,0)}else if(a==="ms"){sel=+s.w;err=""}
 else if(a==="svm"){const v=KS.map(k=>parseFloat($("#m-"+k).value));if(v.some(x=>isNaN(x)||x<0||x>9))err="Nhập đủ 4 điểm từ 0 đến 9.";else{err="";mock[sel]={l:v[0],r:v[1],w:v[2],s:v[3]};S.set("ielts_mock",JSON.stringify(mock))}}
 else if(a==="set")sheet=true;else if(a==="close")sheet=false;
 else if(a==="sd"){const v=$("#sd").value;if(v){start=iso(monOf(parse(v)));S.set("ielts_start",start);view=null;wk=null;sheet=false}}
 else if(a==="th")setTheme(s.v);
 else if(a==="inst"){if(ip){ip.prompt();ip=null}}
 else if(a==="bk"){const u=URL.createObjectURL(new Blob([JSON.stringify({start,done,mock})],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="ielts-coach-backup.json";l.click();setTimeout(()=>URL.revokeObjectURL(u),1500);return}
 else if(a==="rs"){$("#rsf").click();return}
 render();fxDraw()});
document.addEventListener("change",e=>{if(e.target.id!=="rsf")return;const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(o.start){start=o.start;S.set("ielts_start",start)}done=o.done||{};saveD();mock=o.mock||{};S.set("ielts_mock",JSON.stringify(mock));view=null;sheet=false;render()}catch(x){}})});
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;render()});addEventListener("appinstalled",()=>{ip=null;render()});
setInterval(fxDraw,500);render();
})();
</script>
