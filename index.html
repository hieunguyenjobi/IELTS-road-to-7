<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Coach</title>
<meta name="description" content="Huấn luyện viên nhắc kế hoạch học IELTS Academic 7.0 mỗi ngày">
<meta name="theme-color" content="#2f5fd0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#667085;--line:#e4e7ee;--acc:#2f5fd0;--soft:#e8eefc;--ok:#1f9d63;--warn:#b7791f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b202b;--text:#e8ebf2;--muted:#9aa3b5;--line:#2b3242;--acc:#7da2ff;--soft:#232c44;--ok:#4cc38a;--warn:#e0b45a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b202b;--text:#e8ebf2;--muted:#9aa3b5;--line:#2b3242;--acc:#7da2ff;--soft:#232c44;--ok:#4cc38a;--warn:#e0b45a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
h1{font-size:20px;margin:4px 0 2px}h2{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.chip{display:inline-block;background:var(--soft);color:var(--acc);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;margin-right:6px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.cb{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:none;color:#fff;font-size:16px;line-height:20px;cursor:pointer;padding:0}
.task.done .cb{background:var(--ok);border-color:var(--ok)}.task.done .tx{text-decoration:line-through;color:var(--muted)}
.tx{flex:1}.mins{font-size:12px;color:var(--muted)}
button.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:7px 12px;cursor:pointer}
button.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.play{font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--acc);background:none;color:var(--acc);cursor:pointer;margin-top:4px}
.coach{border-left:4px solid var(--acc)}.coach p{margin:4px 0}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pill{border:1px solid var(--line);border-radius:10px;padding:6px 0;text-align:center;font-size:12px;background:var(--card);color:var(--text);cursor:pointer;font-family:inherit}
.pill.cur{border-color:var(--acc);background:var(--soft);font-weight:700}.pill.ok{color:var(--ok)}
.timer{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
input[type=date]{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.blk{font-size:12px;font-weight:700;color:var(--acc);margin:10px 0 0;text-transform:uppercase;letter-spacing:.04em}.sc{width:64px;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}</style></head>

  if(!m)return{t:p,m:0};

const isRest=(w,dow)=>/^Nghỉ/.test(D[w][4][dow]);
function streak(today){
 let s=0;for(let i=0;i<400;i++){const d=add(today,-i),k=iso(d),p=pos(d);
  if(p.n<0||p.w>=D.length)break;
  if((done[k]||[]).length)s++;else if(isRest(p.w,p.dow)||i===0)continue;else break}

function coach(W,day,dn,tot,isToday,st,missed){
 const out=[],S1=W[2].slice(0,3);
 if(/^Tuần đệm/.test(W[7]))out.push("Tuần đệm: không học nội dung mới. Xử lý bài tồn, ôn lỗi lặp trong sổ lỗi và hồi phục. Học nhẹ nhưng đều vẫn tốt hơn bỏ cả tuần.");else if(/THI THỬ|THI THẬT|Full mock/i.test(W[3]))out.push("Tuần kiểm tra: làm đúng giờ thi, không tra từ điển, không dừng giữa chừng. Điểm số là dữ liệu để chỉnh kế hoạch, không phải thước đo giá trị của bạn.");
 else out.push({"GĐ1":"Giai đoạn nền tảng: học đều mỗi ngày quan trọng hơn học lâu. Hiểu chắc từng chủ điểm rồi hãy sang chủ điểm tiếp theo.","GĐ2":"Giai đoạn xây dựng: học quy tắc xong phải làm bài ngay, và ghi mọi lỗi vào sổ lỗi.","GĐ3":"Giai đoạn tăng tốc: bấm giờ thật, ghi nguyên nhân sai, viết lại bài sau khi sửa.","GĐ4":"Giai đoạn bứt phá: giải đề như thi thật. Mỗi lỗi lặp lại là một phần band bạn đang bỏ lỡ."}[S1]||"");
 if(day.rest)out.push("Hôm nay là ngày nghỉ. Ngủ đủ, để não củng cố những gì đã học."+(/^Nghỉ hoặc /.test(day.text)?" Nếu còn sức: "+day.text.replace(/^Nghỉ hoặc /,"")+".":""));
 else if(isToday){
  const nx=day.items.findIndex((_,i)=>!dn.includes(i));
  if(nx<0)out.push("Hoàn thành toàn bộ hôm nay. Chuỗi học hiện tại: "+st+" ngày. Nghỉ ngơi, mai gặp lại.");
  else if(!dn.length){const h=new Date().getHours();out.push((h<11?"Buổi sáng là lúc đầu óc tốt nhất, ":h>=20?"Muộn rồi, làm phần ngắn thôi cũng đủ giữ nhịp, ":"")+"hãy bắt đầu với: "+day.items[nx].t+(day.items[nx].m?" ("+day.items[nx].m+" phút)":"")+". Chỉ cần 10 phút đầu là bạn vào guồng.")}
  else out.push("Còn "+(day.items.length-dn.length)+" phần nữa. Phần tiếp theo: "+day.items[nx].t+".");
  if(missed)out.push("Hôm qua bạn chưa học. Không sao, hôm nay làm đủ phần của mình là được, đừng cố bù gấp đôi.");
 }
 if(isToday&&!day.rest&&day.items.some(x=>x.k)&&dn.length<day.items.length)out.push("Hôm nay có 2 khối 60 phút: nghỉ 5–10 phút giữa hai khối, đừng học dồn một mạch.");
 return out.filter(Boolean);
}
function weekMins(w,v,dow){let s=0,pl=0;for(let i=0;i<7;i++){const k=iso(add(v,i-dow)),t=tasks(D[w][4][i]);pl+=t.items.reduce((a,b)=>a+b.m,0);(done[k]||[]).forEach(j=>{if(t.items[j])s+=t.items[j].m})}return[s,pl]}
const MT={26:4.5,52:5.5,78:6.5,95:6.5,97:7,99:7,101:7};
function gateHtml(W){const w=W[0],g=GT[w]||GT[w+1];let h="";
 if(g)h+='<div class="card" style="border-left:4px solid var(--warn)"><h2>'+(GT[w]?"Cổng đánh giá tuần này":"Sắp tới: cổng đánh giá")+'</h2><b>'+esc(g.t)+" · tuần "+g.w+" · "+esc(g.tg)+'</b><p><b>Điều kiện:</b> '+esc(g.c)+'</p><p><b>Bằng chứng:</b> '+esc(g.e)+'</p><p style="margin:0"><b>Quyết định:</b> '+esc(g.d)+'</p></div>';
 if(w>=95)h+='<div class="card" style="border-left:4px solid var(--warn)"><h2>Quy tắc vàng</h2>'+esc(RULE)+'</div>';
 return h}
function mockHtml(W){const w=W[0],tg=MT[w];if(!tg)return"";const m=mock[w]||{},ks=["l","r","w","s"],nm=["Listening","Reading","Writing","Speaking"];
 let h='<div class="card"><h2>Điểm thi thử tuần này (mục tiêu '+tg+')</h2><div class="row" style="justify-content:flex-start;flex-wrap:wrap">'+ks.map((k,i)=>'<label class="muted" style="font-size:12px">'+nm[i]+'<br><input class="sc" id="m-'+k+'" type="number" step="0.5" min="0" max="9" value="'+(m[k]??"")+'"></label>').join("")+'</div><div style="margin-top:8px"><button class="btn pri" data-a="svm">Lưu điểm</button></div>';
 if(mockErr)h+='<p style="color:var(--warn)">'+esc(mockErr)+'</p>';
 if(ks.every(k=>typeof m[k]==="number")){const a=ks.map(k=>m[k]),o=Math.round(a.reduce((x,y)=>x+y,0)/4*2)/2,g=GT[w]||GT[97];
  h+='<p><b>Overall: '+o+'</b> ('+(o-tg>=0?"+":"")+(o-tg)+' so với mục tiêu). Kỹ năng yếu nhất: '+nm[a.indexOf(Math.min(...a))]+'.</p><p>'+esc(o>=tg?g.ok:o>=tg-0.5?g.half:g.one)+'</p>';
  if(w>=95&&o<6.5)h+='<p style="color:var(--warn)"><b>Mock dưới 6.5: chưa nên đăng ký thi thật.</b></p>';
  h+='<p class="muted" style="font-size:12px;margin:0">Band tự đánh giá không thay thế đánh giá chính thức Writing/Speaking.</p>'}
 return h+'</div>'}
function render(){
 if(!start){app.innerHTML='<div class="card"><h1>IELTS Coach</h1><p class="muted">Chọn ngày bắt đầu Tuần 1 của lộ trình. App sẽ tính tuần hiện tại theo thứ Hai của tuần chứa ngày đó.</p><input type="date" id="sd" value="'+iso(new Date())+'"> <button class="btn pri" data-a="setstart">Bắt đầu</button></div>';return}
 const today=new Date();today.setHours(0,0,0,0);if(!view)view=today;
 const p=pos(view),isToday=utc(view)===utc(today),head='<div class="row"><span class="muted">IELTS Coach</span><span>'+(ip?'<button class="btn pri" data-a="inst">Cài ứng dụng</button> ':'')+'<button class="btn" data-a="chg">Đổi ngày bắt đầu</button></span></div>';
 if(p.n<0){app.innerHTML=head+'<div class="card"><h1>Chưa đến ngày bắt đầu</h1><p>Tuần 1 bắt đầu ngày '+parse(start).toLocaleDateString("vi-VN")+'. Còn '+(-pos(today).n)+' ngày. Dùng thời gian này để chuẩn bị sách và tài khoản Anki.</p><button class="btn" data-a="today">Về hôm nay</button></div>';return}
 if(p.w>=D.length){app.innerHTML=head+'<div class="card"><h1>Bạn đã đi hết lộ trình 104 tuần</h1><p>Hãy đặt lịch thi thật nếu chưa thi, và giữ nhịp ôn nhẹ mỗi ngày.</p></div>';return}
 const W=D[p.w],day=tasks(W[4][p.dow]),k=iso(view),dn=done[k]||[],tot=day.items.reduce((a,b)=>a+b.m,0),st=streak(today);
 const y=add(view,-1),py=pos(y),missed=isToday&&py.n>=0&&!isRest(py.w,py.dow)&&!(done[iso(y)]||[]).length;
 const h=new Date().getHours(),greet=h<11?"Chào buổi sáng":h<14?"Chào buổi trưa":h<18?"Chào buổi chiều":"Chào buổi tối";
 const [wm,wp]=weekMins(p.w,view,p.dow);const pct=day.items.length?Math.round(dn.length/day.items.length*100):0;
 let html=head+'<h1>'+(isToday?greet+"!":DN[p.dow])+'</h1><div class="muted">'+DN[p.dow]+", "+view.toLocaleDateString("vi-VN")+(isToday?"":" (không phải hôm nay)")+'</div>';
 html+='<div style="margin:10px 0"><span class="chip">'+esc(W[2])+'</span><span class="chip">Tuần '+W[0]+'/104 · Tháng '+W[1]+'</span>'+(W[7]!=="Tuần học"?'<span class="chip">'+esc(W[7])+'</span>':'')+(st?'<span class="chip">🔥 '+st+' ngày liên tiếp</span>':'')+'</div>';
 html+='<div class="bar"><i style="width:'+(W[0]/104*100)+'%"></i></div>';
 html+='<div class="card"><h2>Trọng tâm tuần</h2>'+esc(W[3])+(W[9]?'<div class="muted" style="margin-top:6px">Từ mới mục tiêu tuần này: '+W[9]+' từ</div>':'')+'</div>';
 html+='<div class="card"><div class="row"><h2 style="margin:0">'+(day.rest?"Hôm nay":"Việc cần làm")+'</h2>'+(tot?'<span class="mins">'+tot+' phút</span>':'')+'</div>';
 if(day.rest)html+='<p>'+esc(day.text)+'</p>';
 else{html+='<div class="bar"><i style="width:'+pct+'%"></i></div>';
  const hk=day.items.some(x=>x.k);day.items.forEach((it,i)=>{const d=dn.includes(i);if(hk&&(i===0||(it.k&&!day.items[i-1].k)))html+='<div class="blk">'+(it.k?"Khối 2 · 60 phút":"Khối 1")+'</div>';html+='<div class="task'+(d?" done":"")+'"><button class="cb" data-a="tg" data-i="'+i+'" aria-label="Đánh dấu hoàn thành">'+(d?"✓":"")+'</button><div class="tx">'+esc(it.t)+(it.m?'<div class="mins">'+it.m+' phút</div>'+(d?"":'<button class="play" data-a="tm" data-i="'+i+'" data-m="'+it.m+'">▶ Bấm giờ</button>'):"")+'</div></div>'});}
 html+='</div>';
 if(tm)html+='<div class="card" id="tmc"><h2>Đang bấm giờ: '+esc(tm.l)+'</h2><div class="timer" id="tmv">--:--</div><button class="btn" data-a="tmx">Dừng</button></div>';
 const cs=coach(W,day,dn,tot,isToday,st,missed);
 html+='<div class="card coach"><h2>Lời nhắc của coach</h2>'+cs.map(t=>"<p>"+esc(t)+"</p>").join("")+'</div>';
 html+=gateHtml(W)+mockHtml(W);
 html+='<div class="card"><h2>Tuần này</h2><div class="strip">'+SH.map((s,i)=>{const dd=add(view,i-p.dow),ds=iso(dd),dd2=(done[ds]||[]);return'<button class="pill'+(i===p.dow?" cur":"")+(dd2.length?" ok":"")+'" data-a="go" data-d="'+ds+'">'+s+"<br>"+dd.getDate()+(dd2.length?" ✓":"")+"</button>"}).join("")+'</div><p class="muted" style="margin:10px 0 0"><b>Mục tiêu tuần:</b> '+esc(W[5])+'</p><p class="muted" style="margin:6px 0 0"><b>Đã học tuần này:</b> '+wm+' / '+wp+' phút theo lịch ('+(wp?Math.round(wm/wp*100):0)+'%)</p></div>';
 if(W[6].length)html+='<div class="card"><h2>Nhắc trong tuần</h2><ul style="margin:0;padding-left:18px">'+W[6].map(s=>"<li>"+esc(s)+"</li>").join("")+'</ul></div>';
 const nx=add(view,1),pn=pos(nx);
 if(pn.w<D.length){const nd=tasks(D[pn.w][4][pn.dow]);html+='<div class="card"><h2>Ngày mai</h2><span class="muted">'+(nd.rest?esc(nd.text):nd.items.map(i=>esc(i.t)).join(" · "))+'</span></div>'}
 html+='<div class="row"><button class="btn" data-a="prev">← Hôm trước</button><button class="btn" data-a="today">Hôm nay</button><button class="btn" data-a="next">Hôm sau →</button></div><div class="row" style="margin-top:12px"><button class="btn" data-a="bk">Sao lưu dữ liệu</button><button class="btn" data-a="rs">Khôi phục</button></div><input type="file" id="rsf" accept="application/json" hidden>';
 app.innerHTML=html;
}
app.addEventListener("click",e=>{

 else if(a==="tg"){const k=iso(view),i=+b.dataset.i,s=new Set(done[k]||[]);s.has(i)?s.delete(i):s.add(i);done[k]=[...s];S.set("ielts_done",JSON.stringify(done))}
 else if(a==="tm"){tm={l:tasks(D[pos(view).w][4][pos(view).dow]).items[+b.dataset.i].t,end:Date.now()+b.dataset.m*6e4}}
 else if(a==="tmx")tm=null;
 else if(a==="inst"){if(ip){ip.prompt();ip=null}}
 else if(a==="bk"){const u=URL.createObjectURL(new Blob([JSON.stringify({start:S.get("ielts_start"),done,mock})],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="ielts-coach-backup.json";l.click();setTimeout(()=>URL.revokeObjectURL(u),1500);return}
 else if(a==="rs"){document.getElementById("rsf").click();return}
 else if(a==="go")view=parse(b.dataset.d);
 else if(a==="prev"){if(pos(view).n>0)view=add(view,-1)}
 else if(a==="next"){if(pos(view).w<D.length-1||pos(view).dow<6)view=add(view,1)}
 else if(a==="today")view=null;
 render();tick();
});
function tick(){const v=document.getElementById("tmv");if(!tm||!v)return;const r=Math.max(0,tm.end-Date.now());
 v.textContent=r?pad(Math.floor(r/6e4))+":"+pad(Math.floor(r%6e4/1e3)):"Hết giờ! Hãy đánh dấu hoàn thành.";
 if(!r){try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}}
let ip=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;render()});window.addEventListener("appinstalled",()=>{ip=null;render()});
app.addEventListener("change",e=>{if(e.target.id!=="rsf")return;const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(o.start){start=o.start;S.set("ielts_start",start)}done=o.done||{};S.set("ielts_done",JSON.stringify(done));mock=o.mock||{};S.set("ielts_mock",JSON.stringify(mock));view=null;render()}catch(x){}})});
setInterval(tick,1000);

})();
